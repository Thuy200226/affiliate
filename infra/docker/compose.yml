name: affiliate-platform-next
services:
  control:
    profiles: [control]
    build:
      context: ../..
      dockerfile: infra/docker/control.Dockerfile
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - control_state:/app/.local
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  n8n:
    profiles: [orchestration]
    image: docker.n8n.io/n8nio/n8n:2.38.7@sha256:a8c95f75c6fdf65f5f2b7a7b354744eaa1c62bb911b5c00af6499c3f38e4cd32
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set a new private encryption key for this isolated environment}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_state:/home/node/.n8n
    restart: unless-stopped
volumes:
  control_state:
  n8n_state:
